[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelshield"
version = "0.1.0"
description = "A student research project for cautious flow-based network traffic anomaly detection"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "scapy>=2.6,<3",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "streamlit>=1.57,<2",
    "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["sentinelshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
