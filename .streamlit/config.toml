[theme]
base = "dark"
primaryColor = "#2563eb"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#172235"
codeBackgroundColor = "#101a2b"
textColor = "#eaf2ff"
linkColor = "#67e8f9"
borderColor = "#2b3b52"
dataframeBorderColor = "#2b3b52"
dataframeHeaderBackgroundColor = "#1d2b43"
dataframeHeaderTextColor = "#eaf2ff"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "sans-serif"
codeFont = "monospace"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["36px", "26px", "21px", "18px", "16px", "14px"]
headingFontWeights = [700, 650, 600, 600, 550, 500]
chartCategoricalColors = ["#22d3ee", "#fbbf24", "#a78bfa", "#34d399", "#fb7185", "#60a5fa", "#f472b6"]

[theme.sidebar]
backgroundColor = "#101a2b"
secondaryBackgroundColor = "#1b2940"
codeBackgroundColor = "#0b1220"
borderColor = "#2b3b52"

[server]
maxUploadSize = 50
