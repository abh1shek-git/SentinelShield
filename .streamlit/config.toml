[theme]
base = "dark"
primaryColor = "#b45309"
backgroundColor = "#000000"
secondaryBackgroundColor = "#101010"
codeBackgroundColor = "#0c0c0c"
textColor = "#ffffff"
linkColor = "#ed914a"
borderColor = "#343434"
dataframeBorderColor = "#343434"
dataframeHeaderBackgroundColor = "#181818"
dataframeHeaderTextColor = "#ffffff"
greenColor = "#a0a0a0"
orangeColor = "#b45309"
blueColor = "#a0a0a0"
redColor = "#b45309"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "sans-serif"
codeFont = "monospace"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "17px", "15px", "14px"]
headingFontWeights = [650, 600, 600, 550, 500, 500]
chartCategoricalColors = ["#d46a1c", "#ffffff", "#9a9a9a", "#a9460a"]

[theme.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#101010"
codeBackgroundColor = "#0c0c0c"
borderColor = "#343434"

[server]
maxUploadSize = 50
